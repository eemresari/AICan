[pytest]
# Kok modulleri (lisans*.py, parmak_izi.py) ve orchestrator/ altindakiler
# (paths, game_engine, web_server) AYNI sys.path'te: run_web.py de orchestrator/'i
# sys.path'e ekler; boylece `import paths` her yerde TEK modul nesnesidir
# (monkeypatch tek yerden etki eder).
pythonpath = . orchestrator
testpaths = tests orchestrator
addopts = -q
