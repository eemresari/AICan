<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AICAN — Yapay Zekâ Bedeni</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ——— Tasarım sistemi ————————————————————————————————————— */
  :root {
    --bg-0: oklch(0.08 0.04 282);
    --ink-0: oklch(0.97 0.02 260);
    --ink-1: oklch(0.78 0.04 260);
    --ink-2: oklch(0.55 0.05 270);
    --neon-cyan: oklch(0.85 0.18 210);
    --neon-magenta: oklch(0.72 0.26 340);
    --neon-violet: oklch(0.65 0.25 295);
    /* Gövde/konuşma metni: yumuşak beyaz — doygun neon yalnız başlık/kenarlık/glow'da */
    --text-soft: #E8E8F0;
    --hairline: oklch(0.70 0.20 290 / 0.16);
    --grid-line: oklch(0.70 0.20 290 / 0.06);
    /* Aktif jestin baskın rengi — app.js her jest değişiminde günceller. */
    --gesture-glow: 170, 100, 255;     /* mor varsayılan */
    --gesture-glow-2: 110, 230, 255;   /* cyan varsayılan */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-0);
    color: var(--text-soft);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
    cursor: default;
  }

  body {
    display: grid;
    place-items: center;
    /* Dış (body) zemin: jest renginin çok yumuşak, geniş halesi — taşar gibi. */
    background:
      radial-gradient(ellipse 110% 80% at 50% 0%,  rgba(var(--gesture-glow),   0.18), transparent 70%),
      radial-gradient(ellipse 100% 70% at 50% 100%, rgba(var(--gesture-glow-2), 0.12), transparent 70%),
      linear-gradient(180deg, oklch(0.08 0.04 280), oklch(0.05 0.03 285));
    transition: background 1.4s ease-in-out;
  }

  #stage {
    width: 1920px;
    height: 1080px;
    position: relative;
    transform-origin: center;
    overflow: hidden;
    /* Sahnenin asıl atmosferi: aktif jestin rengi geniş ellipse'ler halinde, düşük opaklık.
       Daha geniş ve daha yumuşak — göze rahat, yumuşak yayılan. */
    background:
      radial-gradient(ellipse 1900px 1250px at 50% 50%,  rgba(var(--gesture-glow),   0.28), transparent 78%),
      radial-gradient(ellipse 1200px 900px  at 8%  92%, rgba(var(--gesture-glow),   0.16), transparent 80%),
      radial-gradient(ellipse 1200px 900px  at 92% 8%,  rgba(var(--gesture-glow-2), 0.14), transparent 80%),
      radial-gradient(ellipse 1400px 1000px at 50% 50%, rgba(var(--gesture-glow),   0.10), transparent 85%),
      linear-gradient(180deg, oklch(0.07 0.04 282), oklch(0.04 0.03 285) 60%, oklch(0.05 0.04 290));
    transition: background 1.4s ease-in-out;
  }

  #stars {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.45;
    pointer-events: none;
  }

  #stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 96px 96px;
    mask-image: radial-gradient(ellipse 70% 50% at 50% 50%, black 30%, transparent 85%);
    pointer-events: none;
    z-index: 0;
  }

  /* ——— Üst Şerit — minimal ————————————————————————————————— */
  header.top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 64px 0;
    height: 64px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand-mark {
    width: 28px;
    height: 28px;
    position: relative;
    flex-shrink: 0;
  }
  .brand-mark::before, .brand-mark::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid var(--neon-cyan);
    box-shadow: 0 0 14px var(--neon-cyan), inset 0 0 8px oklch(0.85 0.18 210 / 0.4);
  }
  .brand-mark::after {
    inset: 6px;
    border-color: var(--neon-magenta);
    box-shadow: 0 0 10px var(--neon-magenta);
    animation: spin 8s linear infinite;
  }
  .brand-mark .core {
    position: absolute;
    inset: 11px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 10px white;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .brand-title {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.36em;
    color: var(--ink-1);
  }

  .top-right {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--ink-2);
    text-transform: uppercase;
  }

  /* ——— Ana yerleşim — ortada dev panel ———————————————————— */
  .main {
    position: absolute;
    inset: 64px 0 56px 0;
    z-index: 3;
    display: grid;
    grid-template-columns: 400px 1fr 400px;
    gap: 0;
    padding: 0 48px;
    align-items: center;
  }

  /* Sol/sağ konuşma alanları — çerçeveli, sade.
     Sabit yükseklik + DİKEY ORTALAMA: konuşma kutusu içeriğe göre uzar/kısalır ve
     merkezden simetrik büyüyerek panelle hizalı, ortalı kalır (uzun mesaj taşmaz). */
  .side {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 14px;
    height: 640px;
    justify-content: center;
  }

  .side-label {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.36em;
    color: var(--ink-2);
    text-transform: uppercase;
  }
  .side-label .dash {
    width: 24px;
    height: 1px;
    background: var(--neon-cyan);
    box-shadow: 0 0 6px var(--neon-cyan);
  }
  .side.right .side-label .dash {
    background: var(--neon-magenta);
    box-shadow: 0 0 6px var(--neon-magenta);
  }
  .side.right .side-label { justify-content: flex-end; text-align: right; }

  .speech {
    position: relative;
    min-height: 160px;
    padding: 26px 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: oklch(0.11 0.05 285 / 0.45);
    border: 1px solid oklch(0.70 0.20 290 / 0.12);
    border-radius: 4px;
    backdrop-filter: blur(6px);
  }
  /* köşe çentikleri — çok ince */
  .speech::before, .speech::after {
    content: '';
    position: absolute;
    width: 10px;
    height: 10px;
    border-color: oklch(0.85 0.18 210 / 0.55);
    border-style: solid;
  }
  .speech::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
  .speech::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
  .side.right .speech::before { border-color: oklch(0.72 0.26 340 / 0.55); }
  .side.right .speech::after  { border-color: oklch(0.72 0.26 340 / 0.55); }

  .speech-text {
    font-size: 34px;
    line-height: 1.4;
    letter-spacing: -0.01em;
    color: var(--text-soft);
    font-weight: 450;
    text-wrap: pretty;
    /* Uzun mesaj sahne yuksekligini asmasin. Kaydirma cubugu YERINE JS
       (fitSpeechText) yazi boyutunu bu kutuya sigacak sekilde kademeli kucultur;
       overflow: hidden yalnizca asiri uc durumda sessiz kirpma icin emniyet supabi. */
    max-height: 540px;
    overflow-y: hidden;
  }
  .side.right .speech-text {
    text-align: right;
    font-weight: 500;
  }
  .speech-text.typing::after {
    content: '▊';
    margin-left: 4px;
    color: var(--neon-cyan);
    animation: blink 0.7s steps(1) infinite;
  }
  .side.right .speech-text.typing::after { color: var(--neon-magenta); }
  @keyframes blink { 50% { opacity: 0; } }

  .placeholder {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.22em;
    color: var(--ink-2);
    text-transform: uppercase;
    opacity: 0.55;
    line-height: 1.6;
  }
  .side.right .placeholder { text-align: right; }
  .placeholder .pulse-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--neon-cyan);
    box-shadow: 0 0 8px var(--neon-cyan);
    margin-right: 10px;
    animation: pulseDot 1.6s ease-in-out infinite;
    vertical-align: middle;
  }
  .side.right .placeholder .pulse-dot {
    background: var(--neon-magenta);
    box-shadow: 0 0 8px var(--neon-magenta);
    margin-right: 0;
    margin-left: 10px;
  }
  @keyframes pulseDot { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

  /* Jest etiketi — sadece sağda */
  .gesture-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    align-self: flex-end;
    margin-top: 8px;
    padding: 8px 16px;
    background: oklch(0.18 0.10 290 / 0.45);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-1);
  }
  .gesture-badge .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .gesture-badge.hidden { display: none; }

  /* ——— Orta — DEV LED panel ————————————————————————————— */
  .stage-center {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .led-frame {
    position: relative;
    width: 940px;
    height: 940px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Dönen dış halka — aktif jest renkleriyle (iki yön: primary + secondary), yumuşak */
  .led-frame::before {
    content: '';
    position: absolute;
    inset: -60px;
    border-radius: 50%;
    background:
      conic-gradient(from 0deg,
        transparent 0deg,
        rgba(var(--gesture-glow-2), 0.55) 30deg,
        transparent 80deg,
        transparent 180deg,
        rgba(var(--gesture-glow),   0.65) 220deg,
        transparent 280deg,
        transparent 360deg);
    filter: blur(16px);
    opacity: 0.78;
    animation: spin 18s linear infinite;
    transition: background 1.4s ease-in-out;
  }
  /* LED gövdesinin dış halosu da jest rengine kayar (daha geniş ama düşük yoğunlukta) */
  .led-body {
    transition: box-shadow 1.4s ease-in-out;
  }
  .led-frame::after {
    content: '';
    position: absolute;
    inset: -90px;
    border-radius: 50%;
    border: 1px solid var(--hairline);
    pointer-events: none;
  }

  /* Köşe braketleri — daha ince ve uzak */
  .bracket {
    position: absolute;
    width: 48px;
    height: 48px;
    border: 1px solid var(--neon-cyan);
    box-shadow: 0 0 16px oklch(0.85 0.18 210 / 0.35);
    opacity: 0.85;
  }
  .bracket.tl { top: -28px; left: -28px; border-right: 0; border-bottom: 0; }
  .bracket.tr { top: -28px; right: -28px; border-left: 0; border-bottom: 0; }
  .bracket.bl { bottom: -28px; left: -28px; border-right: 0; border-top: 0; }
  .bracket.br { bottom: -28px; right: -28px; border-left: 0; border-top: 0; }

  /* Panel gövdesi — dış halo aktif jest renginin geniş, yumuşak yayılımı */
  .led-body {
    position: relative;
    width: 900px;
    height: 900px;
    border-radius: 8px;
    background: #04060d;
    box-shadow:
      0 0 0 1.5px oklch(0.85 0.18 210 / 0.40),
      0 0 0 10px oklch(0.10 0.06 285),
      0 0 0 11px oklch(0.85 0.18 210 / 0.13),
      inset 0 0 32px oklch(0.05 0.05 280),
      0 0 140px  rgba(var(--gesture-glow),   0.32),
      0 0 320px  rgba(var(--gesture-glow),   0.18),
      0 0 520px  rgba(var(--gesture-glow-2), 0.10);
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #led-canvas {
    display: block;
    border-radius: 3px;
  }

  /* ——— Alt Şerit — çok sade ——————————————————————————— */
  footer.bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 64px 24px;
    height: 56px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.26em;
    color: var(--ink-2);
    text-transform: uppercase;
  }
  .status-indicator {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .status-indicator .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: oklch(0.55 0.18 30);
    box-shadow: 0 0 8px oklch(0.55 0.18 30);
  }
  .status-indicator .dot.ok {
    background: oklch(0.78 0.18 145);
    box-shadow: 0 0 8px oklch(0.78 0.18 145);
    animation: pulseDot 2s ease-in-out infinite;
  }

  /* Demo kontrolleri — küçük, sağ alt */
  .controls {
    position: absolute;
    right: 64px;
    bottom: 84px;
    display: flex;
    gap: 10px;
    z-index: 5;
    opacity: 0.5;
    transition: opacity 0.2s;
  }
  .controls:hover { opacity: 1; }
  .ctrl-btn {
    padding: 9px 18px;
    background: oklch(0.13 0.08 290 / 0.7);
    border: 1px solid var(--hairline);
    color: var(--ink-1);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.15s;
    border-radius: 2px;
  }
  .ctrl-btn:hover {
    background: oklch(0.20 0.12 290 / 0.8);
    color: var(--ink-0);
    border-color: var(--neon-cyan);
    box-shadow: 0 0 14px oklch(0.85 0.18 210 / 0.35);
  }
  .ctrl-btn.on {
    background: oklch(0.30 0.20 340 / 0.4);
    border-color: var(--neon-magenta);
    color: var(--ink-0);
    box-shadow: 0 0 14px oklch(0.72 0.26 340 / 0.45);
  }

  /* ——— Test Paneli (gizli, T tuşu) ———————————————————————————— */
  #test-panel {
    position: absolute;
    top: 0;
    right: 0;
    width: 380px;
    height: 100%;
    background: oklch(0.07 0.05 285 / 0.96);
    backdrop-filter: blur(16px);
    border-left: 1px solid var(--neon-cyan);
    z-index: 20;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.5, 0, 0, 1);
    overflow-y: auto;
    padding: 28px 24px;
  }
  #test-panel.open { transform: translateX(0); }
  #test-panel h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.28em;
    color: var(--neon-cyan);
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  #test-panel .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-2);
    letter-spacing: 0.2em;
    margin-bottom: 18px;
    text-transform: uppercase;
  }
  #test-list { display: flex; flex-direction: column; gap: 3px; }
  .test-item {
    display: grid;
    grid-template-columns: 32px 14px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 9px 12px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--ink-1);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    text-align: left;
    transition: all 0.1s;
  }
  .test-item:hover {
    background: oklch(0.18 0.10 290 / 0.5);
    border-color: var(--hairline);
  }
  .test-item .num { color: var(--ink-2); }
  .test-item .swatch { width: 10px; height: 10px; border-radius: 50%; }
  .test-item .name { color: var(--ink-0); }
  .test-item .pat { color: var(--ink-2); font-size: 9px; }

  /* ——— Oyun skor HUD ————————————————————————————————— */
  .game-hud {
    position: absolute;
    top: 92px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 32px;
    background: oklch(0.14 0.08 290 / 0.55);
    border: 1px solid oklch(0.82 0.16 75 / 0.40);
    border-radius: 999px;
    backdrop-filter: blur(10px);
    font-family: 'JetBrains Mono', monospace;
    box-shadow: 0 0 28px oklch(0.82 0.16 75 / 0.22);
  }
  .game-hud.hidden { display: none; }
  .game-hud .ghud-lbl {
    font-size: 13px;
    letter-spacing: 0.34em;
    color: var(--ink-2);
  }
  .game-hud .ghud-num {
    font-size: 30px;
    font-weight: 600;
    color: oklch(0.86 0.16 80);
    min-width: 22px;
    text-align: center;
  }
  .game-hud .ghud-sep { color: oklch(0.45 0.05 270); font-size: 22px; }

  /* ——— Sarı kazanç ışığı (AI tur kazandığında) ————————————— */
  /* Figürün arkasında (z-index 2, .main=3) sıcak bir altın patlaması;
     bir kez parlar ve söner. --gesture-glow zaten sarıya kaydığı için
     sahne zemini de o an sıcaklaşır. */
  #win-flash {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    background:
      radial-gradient(ellipse 90% 70% at 50% 46%, rgba(255, 212, 95, 0.55), transparent 62%),
      radial-gradient(ellipse 130% 100% at 50% 50%, rgba(255, 165, 50, 0.28), transparent 76%);
  }
  #win-flash.on { animation: winFlash 1.5s ease-out forwards; }
  @keyframes winFlash {
    0%   { opacity: 0; }
    16%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* AI "bir daha oynayalım" diye ısrar ederken metin hafifçe nabız atar */
  #ai-text.insist { animation: insistPulse 0.8s ease-in-out 3; }
  @keyframes insistPulse {
    0%, 100% { text-shadow: none; }
    50%      { text-shadow: 0 0 22px rgba(255, 205, 95, 0.65); }
  }

  /* Ses odakli secenekler — sohbet balonundan bagimsiz, ust sahne bandi */
  .game-options {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 7;
    width: min(1180px, calc(100% - 520px));
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    justify-content: center;
    gap: 10px;
    pointer-events: none;
  }
  .game-options.hidden { display: none; }
  .game-options.count-2 { grid-template-columns: repeat(2, minmax(180px, 280px)); }
  .game-options.count-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .game-options.count-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .game-options.count-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .game-option {
    display: grid;
    grid-template-columns: minmax(44px, auto) 1fr;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    min-height: 42px;
    background: oklch(0.11 0.05 285 / 0.70);
    border: 1px solid oklch(0.85 0.18 210 / 0.24);
    border-radius: 999px;
    backdrop-filter: blur(10px);
    box-shadow:
      0 8px 24px rgba(0, 0, 0, 0.22),
      inset 0 0 20px rgba(var(--gesture-glow), 0.07);
    animation: gameOptionIn 0.22s ease-out both;
  }
  .game-option.selected {
    border-color: oklch(0.86 0.16 80 / 0.78);
    background: oklch(0.18 0.08 285 / 0.78);
    box-shadow:
      0 0 34px oklch(0.86 0.16 80 / 0.36),
      0 0 12px rgba(var(--gesture-glow), 0.34),
      inset 0 0 24px oklch(0.86 0.16 80 / 0.22);
  }
  .game-option.pulse { animation: optionPicked 1.1s ease-out both; }
  .game-option .go-key {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--neon-cyan);
    text-transform: uppercase;
    opacity: 0.9;
  }
  .game-option .go-label {
    min-width: 0;
    color: var(--ink-0);
    font-size: 15px;
    line-height: 1.2;
    font-weight: 500;
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  @keyframes gameOptionIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes optionPicked {
    0%   { transform: translateY(0) scale(1); }
    22%  { transform: translateY(0) scale(1.045); }
    56%  { transform: translateY(0) scale(1.015); }
    100% { transform: translateY(0) scale(1); }
  }

  /* ——— Kelime oyunu zaman barı (üst bantta, ekranı kapatmaz) ——— */
  .word-timer {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 7;
    width: 460px;
    max-width: 60vw;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 9px 20px;
    background: oklch(0.14 0.06 285 / 0.55);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    backdrop-filter: blur(10px);
  }
  .word-timer.hidden { display: none; }
  .word-timer .wt-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'JetBrains Mono', monospace;
  }
  .word-timer .wt-label { font-size: 13px; letter-spacing: 0.2em; color: var(--ink-1); }
  .word-timer.ai .wt-label { color: var(--neon-cyan); }
  .word-timer .wt-num { font-size: 20px; font-weight: 600; color: var(--neon-cyan); }
  .word-timer .wt-track {
    height: 10px;
    border-radius: 6px;
    overflow: hidden;
    background: oklch(0.24 0.04 270 / 0.7);
  }
  .word-timer .wt-fill {
    height: 100%;
    width: 100%;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-violet));
    box-shadow: 0 0 16px rgba(110, 230, 255, 0.4);
    transition: width 0.12s linear;
  }
  .word-timer .wt-fill.low {
    background: linear-gradient(90deg, #ff8a3c, #ff3b3b);
    box-shadow: 0 0 18px rgba(255, 80, 80, 0.5);
  }

  /* ——— "Düşünüyorum…" göstergesi (AI cevap balonunda, hafif nabızlanır) ——— */
  .ai-thinking {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-1);
    text-align: right;
    animation: thinkPulse 1.6s ease-in-out infinite;
  }
  .ai-thinking.hidden { display: none; }
  @keyframes thinkPulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }

  /* ——— Aşamalı durum rozeti (Dinliyorum/Düşünüyorum/Yazıyor/Konuşuyor) ——— */
  .state-badge {
    position: absolute;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    background: oklch(0.14 0.08 290 / 0.55);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    backdrop-filter: blur(8px);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--ink-1);
  }
  .state-badge.hidden { display: none; }
  .state-badge .sb-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--neon-cyan);
    box-shadow: 0 0 8px var(--neon-cyan);
    animation: pulseDot 1.4s ease-in-out infinite;
  }

  /* ——— Attract / boşta modu (davet metinleri + "Hâlâ orada mısın?") ——— */
  .attract {
    position: absolute;
    left: 0; right: 0;
    bottom: 130px;
    z-index: 8;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    pointer-events: none;
  }
  .attract.hidden { display: none; }
  .attract-msg {
    font-size: 46px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-soft);
    text-shadow: 0 0 24px rgba(var(--gesture-glow), 0.45);
    opacity: 0.92;
    transition: opacity 0.8s ease;   /* yumuşak fade (yalnız opacity) */
  }
  .attract-msg.out { opacity: 0; }
  .attract-count {
    display: flex;
    align-items: baseline;
    gap: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-1);
  }
  .attract-count.hidden { display: none; }
  .attract-count .ac-num {
    font-size: 40px;
    font-weight: 600;
    color: var(--neon-magenta);
    text-shadow: 0 0 18px oklch(0.72 0.26 340 / 0.6);
  }

  /* ——— Mikro-etkileşimler: cevap balonu girişi + jest rozeti cross-fade ——— */
  #ai-text.reply-in { animation: replyIn 0.35s ease-out both; }
  @keyframes replyIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #gesture-badge.swap { animation: badgeSwap 0.3s ease both; }
  @keyframes badgeSwap { from { opacity: 0; } to { opacity: 1; } }

  /* ——— Erişilebilirlik: hareket azaltma tercihi ————————————————— */
  @media (prefers-reduced-motion: reduce) {
    .brand-mark::after,
    .led-frame::before,
    .pulse-dot,
    .status-indicator .dot.ok,
    .speech-text.typing::after,
    #ai-text.insist,
    .game-option,
    .game-option.pulse,
    .ai-thinking,
    .state-badge .sb-dot,
    #gesture-badge.swap,
    #ai-text.reply-in { animation: none !important; }
    #win-flash.on { animation: none !important; opacity: 0 !important; }
    .attract-msg { transition: none !important; }
    body, #stage, .led-frame::before, .led-body { transition: none !important; }
  }

  @media (max-width: 1920px), (max-height: 1080px) {
    body { display: grid; }
    #stage {
      transform: scale(min(calc(100vw / 1920), calc(100vh / 1080)));
    }
  }

  /* ——— TAM EKRAN (immersive) modu — kontrol panelinden açılır ————————————
     #stage.immersive: üst/alt şerit, yan konuşma kutuları (SOL #user-text +
     SAĞ #ai-text) ve LED çerçeve süsleri gizlenir; ortadaki LED göz stage'i
     (1920×1080) kaplar. Göz app.js'te panel.resize(1080) ile NET büyütülür —
     CSS ölçekleme değil (bulanıklık yok). 'i' tuşu ya da panel butonuyla açılır. */
  #stage.immersive .top-bar,
  #stage.immersive .bottom-bar,
  #stage.immersive .side.left,
  #stage.immersive .side.right,
  #stage.immersive .controls { display: none !important; }
  #stage.immersive::before { display: none; }                  /* arka grid çizgileri */
  #stage.immersive .main { inset: 0; padding: 0; grid-template-columns: 1fr; }
  #stage.immersive .led-frame::before,
  #stage.immersive .led-frame::after { display: none; }         /* dönen halka + kenarlık */
  #stage.immersive .led-frame { width: auto; height: auto; }
  #stage.immersive .led-body {
    width: auto; height: auto; padding: 0;
    background: transparent; box-shadow: none; border-radius: 0;
  }
</style>
</head>
<body>
  <canvas id="stars"></canvas>

  <div id="stage">

    <!-- Üst şerit — sade -->
    <header class="top-bar">
      <div class="brand">
        <div class="brand-mark"><div class="core"></div></div>
        <div class="brand-title">AICAN</div>
      </div>
    </header>

    <!-- Oyun skor HUD (gizli — oyun modunda görünür) -->
    <div id="game-hud" class="game-hud hidden"></div>

    <!-- Sarı kazanç ışığı — AI tur kazandığında bir kez parlar (figürün arkasında) -->
    <div id="win-flash"></div>

    <!-- Kelime oyunu zaman barı (gizli — kelime oyununda görünür) -->
    <div id="word-timer" class="word-timer hidden">
      <div class="wt-head"><span class="wt-label">SENİN SIRAN</span><span class="wt-num">20 sn</span></div>
      <div class="wt-track"><div class="wt-fill"></div></div>
    </div>

    <!-- Sesle secim ipuclari (sohbet balonlarindan ayri, ust bant) -->
    <div id="game-options" class="game-options hidden" aria-live="polite"></div>

    <!-- Ana yerleşim -->
    <main class="main">

      <!-- SOL — Ziyaretçi -->
      <section class="side left">
        <div class="side-label"><span class="dash"></span> Ziyaretçi</div>
        <div class="speech">
          <div id="left-placeholder" class="placeholder">
            <span class="pulse-dot"></span>Yazınızı bekliyorum
          </div>
          <p id="user-text" class="speech-text" data-screen-label="user-input"
             aria-live="polite" aria-atomic="false"></p>
        </div>
      </section>

      <!-- ORTA — LED panel (dev) -->
      <section class="stage-center">
        <div class="led-frame">
          <div class="led-body">
            <canvas id="led-canvas" width="876" height="876"></canvas>
          </div>
        </div>
      </section>

      <!-- SAĞ — Yapay Zekâ -->
      <section class="side right">
        <div class="side-label">Yapay Zekâ <span class="dash"></span></div>
        <div class="speech">
          <div id="right-placeholder" class="placeholder">
            Nefes alıyorum<span class="pulse-dot"></span>
          </div>
          <p id="ai-text" class="speech-text" data-screen-label="ai-output"
             aria-live="polite" aria-atomic="false"></p>
          <div id="ai-thinking" class="ai-thinking hidden">Düşünüyorum…</div>
          <span id="gesture-badge" class="gesture-badge hidden"></span>
        </div>
      </section>

    </main>

    <!-- Aşamalı durum rozeti (Dinliyorum/Düşünüyorum/Yazıyor/Konuşuyor — boşta gizli) -->
    <div id="state-badge" class="state-badge hidden">
      <span class="sb-dot"></span><span class="sb-label">Düşünüyorum…</span>
    </div>

    <!-- Attract / boşta modu: davet metinleri + geri sayım (control.js yönetir) -->
    <div id="attract" class="attract hidden" aria-live="polite">
      <div id="attract-msg" class="attract-msg"></div>
      <div id="attract-count" class="attract-count hidden">
        Hâlâ orada mısın? <span class="ac-num" id="ac-num">10</span>
      </div>
    </div>

    <!-- Alt şerit -->
    <footer class="bottom-bar">
      <div class="status-indicator">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">BAĞLANIYOR</span>
      </div>
    </footer>

    <!-- Demo kontrolleri — silik, hover'da belirginleşir -->
    <div class="controls">
      <button id="auto-toggle" class="ctrl-btn">▶ DEMO</button>
      <button id="next-btn" class="ctrl-btn">→</button>
    </div>

    <!-- Test paneli (gizli) -->
    <aside id="test-panel">
      <h3>Jest Test Paneli</h3>
      <div class="hint">31 jest · T kapatır</div>
      <div id="test-list"></div>
    </aside>

  </div>

  <script src="led-panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
